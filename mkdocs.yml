site_name: ELFQuake
site_description: Research notes and reproducible experiments on seismic, VLF, and astronomical data.
site_url: https://danja.github.io/elfquake/
repo_url: https://github.com/danja/elfquake
repo_name: danja/elfquake
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  README.md
  archive/**
  references/**
  2026-07-15_elfquake-progress.md
  announce.md
  baseline-targets.md
  evaluation.md
  exploratory-report.md
  forecast-interface.md
  japan-data.md
  japan_2026-07-30.md
  multimodal-window-schema.md
  output-example.md
  prospective-labeling.md
  sample-dataset.md
  

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"
      archive: true
      archive_name: Archive
      categories: true
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.tasklist

nav:
  - Home: index.md
  - Status: status.md
  - Journal:
      - blog/index.md
  - Research:
      - Overview: overview.md
      - Report: report.md
      - Success criteria: success-criteria.md
      - Next actions: next-actions.md
      - Italy baseline comparison: italy-baseline-comparison.md
  - Data:
      - Source inventory: source-inventory.md
      - Multimodal feasibility: multimodal-feasibility.md
      - VLF feasibility: vlf-feasibility.md
      - Astronomical feasibility: astronomical-feasibility.md
      - WALDO notes: waldo.md
      - Event schema: event-schema.md
      - Japan ISEE VLF: vlf-japan-isee.md
      - Japan earthquake/VLF window: japan-earthquake-vlf-window.md
      - Pisa M4.3 VLF check: pisa-2026-08-04-vlf-check.md
      - Capture-era shift: capture-era-shift.md
      - Cumiana colour-scale change: vlf-palette-shift.md
  - Modeling:
      - Model candidates: model-candidates.md
      - Modeling strategy: modeling-strategy.md
      - Model interface shape: model-interface-shape.md
      - Model comparison: model-comparison.md
      - Feature and training options: feature-training-options.md
      - Event alignment strategies: event-alignment-strategies.md
      - Model fixture: model-fixture.md
      - Model scaling requirements: model-scaling-requirements.md
      - Japan synthetic shape comparison: japan-synthetic-shape-comparison.md
      - Cross-region smoke test: cross-region-generative-smoke.md
  - Simulation:
      - Sandpile simulation: sandpile-simulation.md
      - Signal shape comparison: signal-shape-comparison.md
      - Simulation time scale: simulation-time-scale.md
  - Operations:
      - Steps: steps.md
      - Website: website.md
      - Development environment: development-environment.md
      - Processing graph: processing-graph.md
      - Normalization: normalization.md
  - About:
      - License: license.md
      - How you can help: help.md
